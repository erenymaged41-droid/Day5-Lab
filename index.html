<!DOCTYPE html>
<html>
<head>
    <title>Day 5 Lab</title>
</head>
<body>

    <h1>Tip of the Day</h1>
    <p id="tip"></p>

    <script>
        let tips = [
            "Use let and const to declare variables.",
            "Use meaningful names for variables.",
            "Always indent your code.",
            "Use functions to organize your code.",
            "Use arrays to store multiple values.",
            "Use objects to store related data.",
            "Use console.log() to test your code.",
            "Use comments to explain your code.",
            "Learn how to use array methods.",
            "Practice JavaScript every day."
        ];

        let randomIndex = Math.floor(Math.random() * tips.length);
        document.getElementById("tip").innerHTML = tips[randomIndex];
    </script>

</body>
</html>
